
services:

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      REDIS_DSN: redis://redis:6379
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  github-report-worker:
    build: .
    command: ["python", "-m", "src.common.worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-resumehub}:${RABBITMQ_PASSWORD:-resumehub}@rabbitmq:5672/
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-resumehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-resumehub}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  migrations:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file: .env
    environment:
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
