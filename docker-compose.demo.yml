name: resumehub-local-demo

# Изолированная локальная среда. Существующий .env и рабочие volumes не используются.
x-demo-environment: &demo-environment
  APP_DB_HOST: postgres
  APP_DB_PORT: 5432
  APP_DB_USER: resumehub_demo
  APP_DB_PASSWORD: resumehub_demo_local_only
  APP_DB_NAME: resumehub_demo
  REDIS_DSN: redis://redis:6379
  SECRET_KEY: resumehub-demo-local-only-secret-key-at-least-32-bytes
  GITHUB_TOKEN: ${DEMO_GITHUB_TOKEN:-}
  RABBITMQ_URL: amqp://resumehub_demo:resumehub_demo_local_only@rabbitmq:5672/
  ML_CORE_MODE: demo
  REPORT_PROTOCOL_VERSION: "1"
  ML_EXCHANGE: resumehub.demo.ml
  ML_REQUEST_QUEUE: resumehub.demo.ml.requests
  ML_RESULT_QUEUE: resumehub.demo.ml.results
  ML_DEAD_LETTER_QUEUE: resumehub.demo.ml.invalid-results
  IMAGE_QUEUE: resumehub.demo.images
  IMAGE_S3_ENDPOINT: http://seaweedfs:8333
  IMAGE_S3_PUBLIC_ENDPOINT: http://localhost:8333
  IMAGE_S3_ACCESS_KEY: resumehub-demo-images
  IMAGE_S3_SECRET_KEY: resumehub-demo-images-only

x-runtime: &runtime
  build: .
  environment: *demo-environment

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resumehub_demo
      POSTGRES_PASSWORD: resumehub_demo_local_only
      POSTGRES_DB: resumehub_demo
    volumes: ["demo_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "resumehub_demo", "-d", "resumehub_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: resumehub_demo
      RABBITMQ_DEFAULT_PASS: resumehub_demo_local_only
    volumes: ["demo_rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 25

  migrations:
    <<: *runtime
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  app:
    <<: *runtime
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrations: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  github-report-worker:
    <<: *runtime
    command: ["python", "-m", "src.common.worker"]
    restart: unless-stopped
    depends_on:
      migrations: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  demo-core:
    <<: *runtime
    environment:
      <<: *demo-environment
      DEMO_CORE_FAIL: ${DEMO_CORE_FAIL:-0}
    command: ["python", "-m", "src.common.demo_core", "--delay", "8"]
    restart: unless-stopped
    depends_on:
      rabbitmq: { condition: service_healthy }

  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: resumehub-demo-images
      AWS_SECRET_ACCESS_KEY: resumehub-demo-images-only
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["demo_seaweedfs:/data"]

  image-storage-init:
    <<: *runtime
    command: ["python", "-m", "src.images.init_storage"]
    depends_on:
      seaweedfs: { condition: service_started }

  resume-image-worker:
    <<: *runtime
    command: ["python", "-m", "src.images.worker"]
    restart: unless-stopped
    depends_on:
      migrations: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      image-storage-init: { condition: service_completed_successfully }

volumes:
  demo_postgres:
  demo_rabbitmq:
  demo_seaweedfs:
